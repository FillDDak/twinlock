<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262B5C"/>
      <stop offset="1" stop-color="#12142B"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- left code card -->
  <rect x="34" y="52" width="92" height="120" rx="14" fill="#1E2250" stroke="url(#a)" stroke-width="6"/>
  <rect x="50" y="76" width="52" height="9" rx="4.5" fill="#5EEAD4"/>
  <rect x="50" y="96" width="38" height="9" rx="4.5" fill="#5EEAD4" opacity=".7"/>
  <rect x="62" y="116" width="44" height="9" rx="4.5" fill="#5EEAD4" opacity=".7"/>
  <rect x="50" y="136" width="30" height="9" rx="4.5" fill="#5EEAD4" opacity=".45"/>
  <!-- right code card -->
  <rect x="130" y="84" width="92" height="120" rx="14" fill="#2A2547" stroke="url(#b)" stroke-width="6"/>
  <rect x="146" y="108" width="52" height="9" rx="4.5" fill="#FFD166"/>
  <rect x="146" y="128" width="38" height="9" rx="4.5" fill="#FFD166" opacity=".7"/>
  <rect x="158" y="148" width="44" height="9" rx="4.5" fill="#FFD166" opacity=".7"/>
  <rect x="146" y="168" width="30" height="9" rx="4.5" fill="#FFD166" opacity=".45"/>
  <!-- the lock: two interlocked rings -->
  <g fill="none" stroke-width="13" stroke-linecap="round">
    <rect x="86" y="160" width="64" height="40" rx="20" stroke="url(#a)" transform="rotate(-28 118 180)"/>
    <rect x="114" y="152" width="64" height="40" rx="20" stroke="url(#b)" transform="rotate(-28 146 172)"/>
  </g>
  <path d="M120 186 l14 -8" stroke="url(#a)" stroke-width="13" stroke-linecap="round"/>
</svg>
